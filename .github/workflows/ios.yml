name: Curvex iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'index.html'
      - 'src/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO build

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: Curvex-iOS-Simulator
          path: build/ios-simulator/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 14

      - name: Build unsigned iOS device archive
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Curvex-unsigned.xcarchive \
            CODE_SIGNING_ALLOWED=NO archive

      - name: Upload unsigned archive
        uses: actions/upload-artifact@v4
        with:
          name: Curvex-iOS-Unsigned-Archive
          path: build/Curvex-unsigned.xcarchive
          retention-days: 14
