name: Curvex Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web app for test APK
        run: VITE_ADMOB_TEST_MODE=true npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons
        run: npm run assets:prepare && npm run assets:generate

      - name: Configure AdMob application ID
        run: npm run android:configure-admob

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build release web app with real AdMob ads
        run: VITE_ADMOB_TEST_MODE=false npm run build

      - name: Sync release web app into Android
        run: npx cap sync android

      - name: Build release Android App Bundle (unsigned, real ads)
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/curvex-upload-key.jks"
          test -s "$RUNNER_TEMP/curvex-upload-key.jks"

      - name: Sign release Android App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          jarsigner \
            -keystore "$RUNNER_TEMP/curvex-upload-key.jks" \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            -signedjar android/app/build/outputs/bundle/release/app-release-signed.aab \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$KEY_ALIAS"
          jarsigner -verify android/app/build/outputs/bundle/release/app-release-signed.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Curvex-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload signed Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Curvex-release-AAB-signed
          path: android/app/build/outputs/bundle/release/app-release-signed.aab
          retention-days: 14
